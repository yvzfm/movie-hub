<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub • Clean HD List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">Movie Hub</div>
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search titles, language, category…">
      </div>
    </div>
  </header>

  <nav class="categories">
    <div class="container" id="cat-bar">
      <button class="cat-btn active" data-cat="all">All</button>
    </div>
  </nav>

  <main class="container">
    <div class="section-head">
      <h2>Latest Releases</h2>
      <span id="count" class="count"></span>
    </div>
    <div id="movie-grid" class="grid"></div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>Static frontend. Data lives in movies.json. Public-domain titles with working archive.org links.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
